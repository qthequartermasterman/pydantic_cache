[project]
name = "auto-pydantic-cache"
version = "1.1.1"
description = "A caching utility for functions returning Pydantic models, optimized for deterministic and generative AI workflows."
readme = "README.md"
authors = [
    { name = "Andrew P. Sansom", email = "andrew@euleriancircuit.com" }
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.3.8,<4.5.0",
    "pydantic>=2.10.0,<2.12.0",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "openai==1.108.1",
    "pydantic-ai==1.0.10",
    "pyrefly==0.34.0",
    "pyright==1.1.405",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "ruff==0.13.1",
    "toml-sort==0.24.3",
    "ty==0.0.1a21",
]

[project.optional-dependencies]
build = ["uv==0.8.19"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812"]
per-file-ignores = { "tests/**/*.py" = ["S101", "PLR2004", "ARG001", "D100", "D104"] }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
